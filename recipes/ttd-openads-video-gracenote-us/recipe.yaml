id: ttd-openads-video-gracenote-us
name: "OpenAds: Video Ad via Ad Server, with Gracenote + LiveRamp (US)"
consoleRecipeId: ttd-podded-video-gracenote-us
description: >-
  Solicit bids for a video ad break from The Trade Desk OpenAds. Caches the VAST server-side and returns a cache ID to pass to your primary ad server for server-side unwrapping. Uses a LiveRamp envelope ID for user identity. OpenRTB 2.6 with US Privacy and GPP signals; use the EU variant for EEA and UK traffic.
categories:
  - AD_DECISIONING
services:
  - The Trade Desk
  - HTTP Request
hook: PRE_ADS_REQUEST
functionType: HTTP_REQUEST
tier: L1
documentationUrl: https://open.thetradedesk.com/seller/docsApp/GuidesSeller/ssp/doc/StandardAdapter
requiredReplacements:
  "TTD Publisher ID": YOUR_TTD_PUBLISHER_ID
  "Supply Source ID": YOUR_SUPPLY_SOURCE_ID
  "Bid Floor": YOUR_BIDFLOOR_NUMBER
